<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreshProof labeler</title>
<style>
  :root {
    --bg: #f6f4ee;
    --panel: #fffdf8;
    --ink: #15151a;
    --muted: #6d6d75;
    --line: #e2dfd5;
    --accent: #1f6f4a;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 22px 32px; border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.035em; }
  #progress { color: var(--muted); font-variant-numeric: tabular-nums; }
  main {
    display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px;
    padding: 24px 32px 48px; align-items: start;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 16px; } }
  .stagewrap { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  #name { font-weight: 600; margin-bottom: 10px; word-break: break-all; }
  #stage { position: relative; width: fit-content; max-width: 100%; margin: 0 auto; background: #ddd9cd; }
  #photo { display: block; max-width: 100%; max-height: 74vh; }
  #mask {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0.5; cursor: crosshair; touch-action: none;
  }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
  .tools label { color: var(--muted); font-size: 13px; }
  button {
    font: inherit; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); cursor: pointer;
  }
  button:hover { border-color: var(--ink); }
  button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 5px; }
  input[type=text], input[type=number], select {
    width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .grades label {
    display: block; text-align: center; padding: 8px 0; border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer; background: #fff; font-weight: 600;
  }
  .grades input { display: none; }
  .grades input:checked + span { color: #fff; }
  .grades label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grades small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
  .grades label:has(input:checked) small { color: #d8efe3; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  #status { min-height: 22px; margin: 10px 0 0; font-size: 14px; color: var(--accent); }
  #status.err { color: var(--danger); }
  .keys { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  kbd { background: #efece2; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; }
  #empty { padding: 60px 20px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>FreshProof labeler</h1>
  <div id="progress"></div>
</header>

<main id="app">
  <section class="stagewrap">
    <div id="name"></div>
    <div id="stage">
      <img id="photo" alt="photo to label" draggable="false">
      <canvas id="mask"></canvas>
    </div>
    <div class="tools">
      <button id="paintBtn" class="on" type="button">Paint</button>
      <button id="eraseBtn" type="button">Erase</button>
      <label>Brush <input id="brush" type="range" min="4" max="120" value="28"></label>
      <button id="clearBtn" type="button">Clear mask</button>
      <span style="flex:1"></span>
      <button id="prevBtn" type="button">&larr; Back</button>
      <button id="nextBtn" type="button">Next &rarr;</button>
    </div>
  </section>

  <aside>
    <div class="field">
      <label>Grade</label>
      <div class="grades" id="grades">
        <label><input type="radio" name="grade" value="A">A<small>1</small></label>
        <label><input type="radio" name="grade" value="B">B<small>2</small></label>
        <label><input type="radio" name="grade" value="C">C<small>3</small></label>
        <label><input type="radio" name="grade" value="reject">Rej<small>4</small></label>
      </div>
    </div>
    <div class="field">
      <label for="produce">Produce</label>
      <input id="produce" type="text" list="produceList" autocomplete="off">
      <datalist id="produceList"></datalist>
    </div>
    <div class="field">
      <label for="light">Light</label>
      <select id="light"></select>
    </div>
    <div class="field">
      <label for="phone">Phone model</label>
      <input id="phone" type="text" autocomplete="off">
    </div>
    <div class="row">
      <div class="field">
        <label for="item">Item id</label>
        <input id="item" type="text" autocomplete="off" placeholder="tomato_01">
      </div>
      <div class="field">
        <label for="days">Days left</label>
        <input id="days" type="number" min="0" step="0.5">
      </div>
    </div>
    <div class="field">
      <label for="labeler">Labeled by</label>
      <input id="labeler" type="text" autocomplete="off">
    </div>
    <button id="saveBtn" class="primary" type="button" style="width:100%">Save and next</button>
    <p id="status"></p>
    <div class="keys">
      <kbd>1</kbd> to <kbd>4</kbd> grade &nbsp; <kbd>E</kbd> paint or erase<br>
      <kbd>[</kbd> <kbd>]</kbd> brush size &nbsp; <kbd>X</kbd> clear mask<br>
      <kbd>&larr;</kbd> <kbd>&rarr;</kbd> back or next &nbsp; <kbd>Ctrl</kbd>+<kbd>Enter</kbd> save<br>
      Grade A means no defect, so leave the mask empty.
    </div>
  </aside>
</main>
<div id="empty" hidden>No photos found. Put your photos in the data/raw folder and reload this page.</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const S = { photos: [], idx: -1, mode: "paint", drawing: false, last: null, loading: 0 };
const canvas = $("mask");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const img = $("photo");
const MAX_CANVAS = 1024;

function remember(key, value) { try { localStorage.setItem("fp_" + key, value); } catch (e) {} }
function recall(key, fallback) {
  try { const v = localStorage.getItem("fp_" + key); return v === null ? fallback : v; }
  catch (e) { return fallback; }
}

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) {
    let detail = response.statusText;
    try {
      const body = await response.json();
      detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail);
    } catch (e) {}
    throw new Error(detail);
  }
  return response.json();
}

function status(text, isError) {
  const el = $("status");
  el.textContent = text || "";
  el.className = isError ? "err" : "";
}

function renderProgress() {
  const done = S.photos.filter((p) => p.labeled).length;
  $("progress").textContent = S.photos.length
    ? `${done} of ${S.photos.length} labeled  |  photo ${S.idx + 1}`
    : "";
}

function getGrade() {
  const picked = document.querySelector('input[name="grade"]:checked');
  return picked ? picked.value : null;
}
function setGrade(value) {
  document.querySelectorAll('input[name="grade"]').forEach((r) => { r.checked = r.value === value; });
}

function setMode(mode) {
  S.mode = mode;
  $("paintBtn").classList.toggle("on", mode === "paint");
  $("eraseBtn").classList.toggle("on", mode === "erase");
}

function clearMask() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

function sizeCanvas() {
  const w = img.naturalWidth || 1, h = img.naturalHeight || 1;
  const scale = Math.min(1, MAX_CANVAS / Math.max(w, h));
  canvas.width = Math.max(1, Math.round(w * scale));
  canvas.height = Math.max(1, Math.round(h * scale));
}

function exportMask() {
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const px = data.data;
  let any = false;
  for (let i = 0; i < px.length; i += 4) {
    if (px[i + 3] > 0) { px[i] = px[i + 1] = px[i + 2] = 255; px[i + 3] = 255; any = true; }
    else { px[i + 3] = 0; }
  }
  if (!any) return null;
  const out = document.createElement("canvas");
  out.width = canvas.width; out.height = canvas.height;
  out.getContext("2d").putImageData(data, 0, 0);
  return out.toDataURL("image/png");
}

function drawExistingMask(photoId) {
  return new Promise((resolve) => {
    const m = new Image();
    m.onload = () => {
      const tmp = document.createElement("canvas");
      tmp.width = canvas.width; tmp.height = canvas.height;
      const t = tmp.getContext("2d", { willReadFrequently: true });
      t.drawImage(m, 0, 0, tmp.width, tmp.height);
      const d = t.getImageData(0, 0, tmp.width, tmp.height);
      const px = d.data;
      for (let i = 0; i < px.length; i += 4) {
        const on = px[i] > 127;
        px[i] = 220; px[i + 1] = 40; px[i + 2] = 40; px[i + 3] = on ? 255 : 0;
      }
      ctx.putImageData(d, 0, 0);
      resolve();
    };
    m.onerror = () => resolve();
    m.src = `/api/photos/${encodeURIComponent(photoId)}/mask?ts=${Date.now()}`;
  });
}

function fillForm(label) {
  if (label) {
    setGrade(label.grade);
    $("produce").value = label.produce_type || "";
    $("light").value = label.light;
    $("phone").value = label.phone_model || "";
    $("item").value = label.item_id || "";
    $("days").value = label.days_until_spoiled === null ? "" : label.days_until_spoiled;
    $("labeler").value = label.labeler === "unknown" ? recall("labeler", "") : label.labeler;
  } else {
    setGrade(null);
    $("produce").value = recall("produce", "");
    $("light").value = recall("light", "daylight");
    $("phone").value = recall("phone", "");
    $("item").value = recall("item", "");
    $("days").value = "";
    $("labeler").value = recall("labeler", "");
  }
}

async function loadPhoto(i) {
  if (i < 0 || i >= S.photos.length) return;
  const ticket = ++S.loading;
  S.idx = i;
  const photoId = S.photos[i].photo_id;
  $("name").textContent = photoId;
  renderProgress();
  status("");
  clearMask();
  try {
    const info = await api(`/api/photos/${encodeURIComponent(photoId)}/label`);
    await new Promise((resolve) => {
      img.onload = resolve; img.onerror = resolve;
      img.src = `/api/photos/${encodeURIComponent(photoId)}/image`;
    });
    if (ticket !== S.loading) return;
    sizeCanvas();
    fillForm(info.label);
    if (info.has_mask) await drawExistingMask(photoId);
  } catch (err) {
    status(err.message, true);
  }
}

function nextUnlabeledAfter(start) {
  const n = S.photos.length;
  for (let step = 1; step <= n; step++) {
    const j = (start + step) % n;
    if (!S.photos[j].labeled) return j;
  }
  return -1;
}

async function save() {
  const grade = getGrade();
  if (!grade) { status("Pick a grade first (keys 1 to 4).", true); return; }
  const photoId = S.photos[S.idx].photo_id;
  const body = {
    produce_type: $("produce").value.trim().toLowerCase(),
    grade,
    light: $("light").value,
    phone_model: $("phone").value.trim(),
    item_id: $("item").value.trim() || null,
    days_until_spoiled: $("days").value === "" ? null : Number($("days").value),
    labeler: $("labeler").value.trim() || "unknown",
    mask_png_base64: exportMask(),
  };
  try {
    await api(`/api/photos/${encodeURIComponent(photoId)}/label`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  } catch (err) { status(err.message, true); return; }

  remember("produce", body.produce_type);
  remember("light", body.light);
  remember("phone", body.phone_model);
  remember("labeler", body.labeler === "unknown" ? "" : body.labeler);
  S.photos[S.idx].labeled = true;
  renderProgress();
  const next = nextUnlabeledAfter(S.idx);
  if (next === -1) { status("Saved. Every photo is labeled. Nice work."); return; }
  await loadPhoto(next);
  status("Saved.");
}

function position(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height };
}
function stroke(a, b) {
  const brush = Number($("brush").value);
  ctx.globalCompositeOperation = S.mode === "erase" ? "destination-out" : "source-over";
  ctx.strokeStyle = "rgb(220,40,40)";
  ctx.lineWidth = brush * canvas.width / Math.max(canvas.getBoundingClientRect().width, 1);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
}

canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId);
  S.drawing = true; S.last = position(e); stroke(S.last, S.last);
});
canvas.addEventListener("pointermove", (e) => {
  if (!S.drawing) return;
  const p = position(e); stroke(S.last, p); S.last = p;
});
["pointerup", "pointercancel"].forEach((t) => canvas.addEventListener(t, () => { S.drawing = false; }));

$("paintBtn").onclick = () => setMode("paint");
$("eraseBtn").onclick = () => setMode("erase");
$("clearBtn").onclick = clearMask;
$("prevBtn").onclick = () => loadPhoto(S.idx - 1);
$("nextBtn").onclick = () => loadPhoto(S.idx + 1);
$("saveBtn").onclick = save;

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); save(); return; }
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  if (["1", "2", "3", "4"].includes(e.key)) setGrade(["A", "B", "C", "reject"][Number(e.key) - 1]);
  else if (e.key === "e" || e.key === "E") setMode(S.mode === "paint" ? "erase" : "paint");
  else if (e.key === "x" || e.key === "X") clearMask();
  else if (e.key === "[") $("brush").value = Math.max(4, Number($("brush").value) - 6);
  else if (e.key === "]") $("brush").value = Math.min(120, Number($("brush").value) + 6);
  else if (e.key === "ArrowLeft") loadPhoto(S.idx - 1);
  else if (e.key === "ArrowRight") loadPhoto(S.idx + 1);
});

async function init() {
  try {
    const [options, photos] = await Promise.all([api("/api/options"), api("/api/photos")]);
    $("produceList").innerHTML = options.produce_types.map((p) => `<option value="${p}">`).join("");
    $("light").innerHTML = options.lights.map((l) => `<option value="${l}">${l.replace("_", " ")}</option>`).join("");
    S.photos = photos;
  } catch (err) { status(err.message, true); return; }
  if (!S.photos.length) { $("app").hidden = true; $("empty").hidden = false; return; }
  const first = S.photos.findIndex((p) => !p.labeled);
  await loadPhoto(first === -1 ? 0 : first);
}
init();
</script>
</body>
</html>
